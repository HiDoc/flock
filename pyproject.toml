[project]
name = "flock"
version = "0.0.0"
description = "FlockRig / FlockSkin — a recurrent local rule for rigging and skinning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "mlx>=0.32",
    "libigl>=2.6",
    "potpourri3d>=1.4",
    "trimesh>=4.5",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
flock = "flock.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flock"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D100",    # module docstring: enforced where it matters, not on __init__
    "D107",    # __init__ docstring: the class docstring carries it
    "ANN401",  # Any is deliberate at the array boundary
    # The ubiquitous language is mathematical: sigma, alpha, Delta, section signs
    # and en-dashes are the spec's own notation. Transliterating them would break
    # the doc-to-code mapping that ADR-0004 exists to preserve.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
# typer declares options as argument defaults; that is the framework idiom.
"src/flock/cli/*" = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/flock"]

# Third-party geometry and array libraries ship no usable stubs.
[[tool.mypy.overrides]]
module = ["mlx.*", "igl.*", "potpourri3d.*", "trimesh.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
